<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f5f2" />
    <title>博士扩列档案 · 明日方舟同人</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./qr.css" />
    <link rel="stylesheet" href="./rich-text.css" />
    <script src="./vendor/JsBarcode.all.min.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="wordmark" href="#top"><span class="mark">RI</span><span>博士扩列档案</span></a>
      <a id="home-link" href="https://tiny.leisiyu.dev/" hidden>返回 Tiny Projects ↗</a>
    </header>
    <main id="top">
      <section class="controls" aria-label="档案编辑工具">
        <div class="control-row">
          <label>阵营<select id="faction-select"></select></label>
          <label class="quote-default">默认语录<input id="quote-default" type="text" readonly /></label>
          <button id="restore-quote" type="button">恢复默认</button>
          <label>头像<input id="avatar-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" /></label>
          <button id="remove-avatar" type="button">移除头像</button>
          <label>二维码数量<select id="qr-count"><option value="1">1 个</option><option value="2" selected>2 个</option></select></label>
          <button id="operator-open" type="button">＋ 选择干员</button>
          <label>导出<select id="export-scale"><option value="1">1×</option><option value="2" selected>2×</option><option value="3">3×</option></select></label>
          <button id="export-button" class="primary" type="button">导出 PNG</button>
        </div>
        <div id="richtext-toolbar" class="toolbar"></div>
        <div class="control-row qr-controls">
          <div class="qr-slot" data-qr-slot="qr1"><b>左侧二维码</b><select class="qr-type"><option value="wechat">微信</option><option value="qq">QQ</option></select><label>导入<input class="qr-file" type="file" accept="image/png,image/jpeg,image/webp" /></label><button class="upload-link" type="button">选择图片</button><button class="crop-link" type="button" hidden>调整裁切</button><button class="clear-qr" type="button">清除</button><span class="qr-status" aria-live="polite"></span></div>
          <div class="qr-slot" data-qr-slot="qr2"><b>第二个二维码</b><select class="qr-type"><option value="qq">QQ</option><option value="wechat">微信</option></select><label>导入<input class="qr-file" type="file" accept="image/png,image/jpeg,image/webp" /></label><button class="upload-link" type="button">选择图片</button><button class="crop-link" type="button" hidden>调整裁切</button><button class="clear-qr" type="button">清除</button><span class="qr-status" aria-live="polite"></span></div>
          <span id="export-status" role="status"></span>
        </div>
      </section>
      <section class="sheet-scroll" aria-label="原尺寸档案画布">
        <p class="sheet-help">直接点卡片文字填写，点选高亮，拖动刻度</p>
        <div id="sheet" class="sheet">
          <canvas id="profile-canvas" width="1640" height="2360" aria-label="博士扩列档案卡"></canvas>
          <div id="sheet-editors" class="sheet-editors">
            <div id="field-nickname" class="rich-field nickname" aria-label="昵称"></div>
            <div id="field-motto" class="rich-field motto" aria-label="阵营格言"></div>
            <div id="field-quote" class="rich-field quote" aria-label="阵营语录"></div>
            <div id="field-oshi" class="rich-field oshi" aria-label="我推的角色"></div>
            <div id="field-extra" class="rich-field extra" aria-label="补充说明"></div>
            <div id="choice-gender" class="choice-hit" role="group" aria-label="性别"></div>
            <div id="choice-contact" class="choice-hit" role="group" aria-label="想扩列"></div>
            <div id="choice-server" class="choice-hit" role="group" aria-label="区服"></div>
            <div id="choice-seniority" class="choice-hit" role="group" aria-label="资历"></div>
            <div id="choice-focus" class="choice-hit" role="group" aria-label="更侧重"></div>
            <div id="slider-layer" class="slider-layer"></div>
            <button id="avatar-hit" class="avatar-hit" type="button" aria-label="更换头像"></button>
            <button id="qr-hit-1" class="qr-hit" type="button" aria-label="导入左侧二维码"></button>
            <button id="qr-hit-2" class="qr-hit" type="button" aria-label="导入第二个二维码"></button>
          </div>
        </div>
      </section>
      <footer class="credits">
        <span>原作 <a href="https://www.xiaohongshu.com/user/profile/647e0cd800000000250355fe" target="_blank" rel="noreferrer">Sayoko.</a> · 表单化 <a href="https://tiny.leisiyu.dev/" target="_blank" rel="noreferrer">暝行镌无</a></span>
        <span>游戏素材 鹰角网络 · <a href="./ASSET-SOURCES.md">素材来源</a> · <a href="./QUOTE-SOURCES.md">原句来源</a> · 非商用</span>
      </footer>
      <dialog id="operator-dialog" class="operator-dialog">
        <header><h2>选择代表干员 <small>最多 8 位</small></h2><button id="operator-close" type="button">完成</button></header>
        <label class="operator-search">搜索干员<input id="operator-search" type="search" placeholder="姓名、拼音、首字母或英文" autocomplete="off" /></label>
        <div id="selected-operators" class="selected-operators"></div>
        <div id="operator-results" class="operator-results"></div>
        <button id="operator-more" type="button">加载更多</button>
      </dialog>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
